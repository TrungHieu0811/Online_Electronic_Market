spring.application.name=electromart
server.port=8080

# ===============================
# DATABASE (SQL SERVER)
# ===============================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=electromart;TrustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Password@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


# JWT – Set JWT_SECRET env variable in production to a strong Base64-encoded 256-bit key
# Example to generate: openssl rand -base64 64
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGp3dCBzZWNyZXQga2V5IGZvciBkZW1vYXV0aCBhcHBsaWNhdGlvbg==}
# Access Token: 15 phút
jwt.expiration=900000
# Refresh Token: 7 ngày
jwt.refresh-expiration=604800000

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# FILE UPLOAD 
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false

